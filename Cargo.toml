[package]
name = "bogentag"
description = "The time read from the Sun's arc"
version = "0.1.0"
edition = "2024"
authors = ["David M. Anderson"]
license = "MIT"
repository = "https://github.com/excelano/bogentag-desktop"
publish = false
rust-version = "1.95"

[[bin]]
name = "bogentag"
path = "src/main.rs"

[dependencies]
bz = "0.7.0"
chrono = "0.4"
chrono-tz = "0.10"
eframe = "0.36"
iana-time-zone = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

png = { version = "0.18", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[features]
screenshot = ["dep:png"]

[profile.release]
lto = "thin"
